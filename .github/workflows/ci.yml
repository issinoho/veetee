name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc
      - run: cargo xtask openvms

  vttest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask vttest

  esctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask esctest

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CARGO_HOME: ${{ github.workspace }}\.cargo-home
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-mesa
      - uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-
      - run: cargo --version && pkg-config --modversion gtk4 libadwaita-1
      - run: cargo build --release -p veetee -p vt-headless
      - run: cargo test --workspace
      # target comes back from the cache with the zips of earlier runs in
      # target/dist, which the globs below would pick up as well.
      - run: rm -rf target/dist && packaging/windows/bundle.sh
      - name: Smoke test with software OpenGL
        run: |
          set -x +e
          pacman -Ql mingw-w64-ucrt-x86_64-mesa | grep -i '\.dll$' || true
          dir=target/dist/smoke
          rm -rf "$dir" && mkdir -p "$dir"
          name=veetee-$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)-x86_64-windows
          unzip -q "target/dist/$name.zip" -d "$dir"
          app="$dir/$name/bin"
          "$app/veetee.exe" --help > "$dir/help.txt"; help=$?; echo "help exit $help"
          # A console build first, so GTK's own messages are visible.
          cargo build -p veetee
          # Mesa's software OpenGL stands in for a graphics driver; it and its
          # own dependencies go next to both builds (never into the zip).
          for gl in opengl32.dll libgallium_wgl.dll; do
            cp "/ucrt64/bin/$gl" target/debug/
            cp -n "/ucrt64/bin/$gl" "$app/"
          done
          ldd /ucrt64/bin/libgallium_wgl.dll | awk '{ print $3 }' | grep -i '^/ucrt64/bin/' \
            | sort -u | xargs -I{} cp -n {} "$app/"
          export GALLIUM_DRIVER=llvmpipe VEETEE_CAPTURE_DELAY_MS=8000
          command="echo veetee on Windows & ver & ping -n 60 127.0.0.1 >NUL"
          VEETEE_CAPTURE="$(cygpath -w "$PWD/$dir/debug.ppm")" \
            timeout 120 target/debug/veetee.exe --model vt420 --command "$command"
          debug=$?; echo "debug exit $debug"
          # Then the bundle, with no MSYS2 GTK on the PATH, as a user would have.
          VEETEE_CAPTURE="$(cygpath -w "$PWD/$dir/bundle.ppm")" PATH=/usr/bin:/c/Windows/system32:/c/Windows \
            /usr/bin/timeout 120 "$app/veetee.exe" --model vt525 --command "$command"
          bundle=$?; echo "bundle exit $bundle"
          # Without Mesa the release build must at least load every DLL it needs.
          rm -f "$app/opengl32.dll" "$app/libgallium_wgl.dll"
          PATH=/usr/bin:/c/Windows/system32:/c/Windows "$app/vt-headless.exe" --help > /dev/null
          headless=$?; echo "vt-headless exit $headless"
          ls -l "$dir"
          # Nothing here may fail quietly: a bundle that cannot even load its
          # DLLs exits 127 and must stop the build.
          [ "$help" = 0 ] && [ "$debug" = 0 ] && [ "$bundle" = 0 ] && [ "$headless" = 0 ]
      - uses: actions/upload-artifact@v4
        with:
          name: veetee-windows
          path: |
            target/dist/veetee-*-x86_64-windows.zip
            target/dist/smoke/*.ppm
            target/dist/smoke/help.txt
          if-no-files-found: warn

  flatpak:
    # Builds the Flatpak from packaging/flatpak with the vendored crates.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: veetee-x86_64.flatpak
          manifest-path: packaging/flatpak/com.issinoho.Veetee.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/cargo-sources.json') }}

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run parser -- -max_total_time=60
