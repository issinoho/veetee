name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc
      - run: cargo xtask openvms

  vttest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask vttest

  esctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask esctest

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CARGO_HOME: ${{ github.workspace }}\.cargo-home
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-mesa
      - uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-
      - run: cargo --version && pkg-config --modversion gtk4 libadwaita-1
      - run: cargo build --release -p veetee -p vt-headless
      - run: cargo test --workspace
      - run: packaging/windows/bundle.sh
      - name: Smoke test with software OpenGL
        continue-on-error: true
        run: |
          set -x
          pacman -Ql mingw-w64-ucrt-x86_64-mesa | grep -i '\.dll$' || true
          dir=target/dist/smoke
          rm -rf "$dir" && mkdir -p "$dir"
          unzip -q target/dist/veetee-*-x86_64-windows.zip -d "$dir"
          app=$(echo "$dir"/veetee-*/bin)
          "$app/veetee.exe" --help > "$dir/help.txt"; echo "help exit $?"
          # A console build first, so GTK's own messages are visible.
          cargo build -p veetee
          for gl in opengl32.dll libgallium_wgl.dll libglapi.dll; do
            cp "/ucrt64/bin/$gl" target/debug/ 2>/dev/null || true
            cp "/ucrt64/bin/$gl" "$app/" 2>/dev/null || true
          done
          export GALLIUM_DRIVER=llvmpipe VEETEE_CAPTURE_DELAY_MS=8000
          command="echo veetee on Windows & ver & ping -n 60 127.0.0.1 >NUL"
          VEETEE_CAPTURE="$(cygpath -w "$PWD/$dir/debug.ppm")" \
            timeout 120 target/debug/veetee.exe --model vt420 --command "$command"
          echo "debug exit $?"
          # Then the bundle, with only Windows on the PATH as a user would have.
          VEETEE_CAPTURE="$(cygpath -w "$PWD/$dir/bundle.ppm")" PATH=/c/Windows/system32:/c/Windows \
            /usr/bin/timeout 120 "$app/veetee.exe" --model vt525 --command "$command"
          echo "bundle exit $?"
          ls -l "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: veetee-windows
          path: |
            target/dist/veetee-*-x86_64-windows.zip
            target/dist/smoke/*.ppm
            target/dist/smoke/help.txt
          if-no-files-found: warn

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run parser -- -max_total_time=60
