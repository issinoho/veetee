[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.8.7"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Iain Smith <iain@issinoho.com>"]

[workspace.dependencies]
vt-parser = { path = "crates/vt-parser", version = "0.8.7" }
vt-core = { path = "crates/vt-core", version = "0.8.7" }
vt-lat = { path = "crates/vt-lat", version = "0.8.7" }
vt-fonts = { path = "crates/vt-fonts", version = "0.8.7" }
vt-keyboard = { path = "crates/vt-keyboard", version = "0.8.7" }
vt-render = { path = "crates/vt-render", version = "0.8.7" }
vt-transport = { path = "crates/vt-transport", version = "0.8.7" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
debug = 1

# Font sets are resampled at startup; keep that quick in debug builds too.
[profile.dev.package.vt-fonts]
opt-level = 3
