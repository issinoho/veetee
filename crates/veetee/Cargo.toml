[package]
name = "veetee"
description = "A DEC VT terminal for the Linux and Windows desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
async-channel = "2"
cpal = "0.18"
glow = "0.18"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "1"
vt-core.workspace = true
vt-fonts.workspace = true
vt-keyboard.workspace = true
vt-render.workspace = true
vt-transport.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[lints]
workspace = true

# Debian package, built by `cargo xtask dist` with cargo-deb.
[package.metadata.deb]
maintainer = "Iain Smith <iain@issinoho.com>"
copyright = "2026 Iain Smith and the veetee contributors"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """\
veetee emulates DEC VT100, VT102, VT220, VT320 and VT420 terminals for OpenVMS and other \
DEC hosts, with Telnet, SSH, serial and local connections, DEC-style fonts and an LK401 \
keyboard layout."""
section = "x11"
priority = "optional"
depends = "$auto"
recommends = "openssh-client"
assets = [
    ["target/release/veetee", "usr/bin/", "755"],
    ["target/release/vt-headless", "usr/bin/", "755"],
    ["../../data/com.issinoho.Veetee.desktop", "usr/share/applications/", "644"],
    ["../../data/com.issinoho.Veetee.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../data/icons/com.issinoho.Veetee.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../README.md", "usr/share/doc/veetee/README.md", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/veetee/CHANGELOG.md", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/veetee/LICENSE-APACHE", "644"],
    ["../../THIRD-PARTY.md", "usr/share/doc/veetee/THIRD-PARTY.md", "644"],
    ["../vt-fonts/fonts/OFL.txt", "usr/share/doc/veetee/fonts-OFL.txt", "644"],
]
