[package]
name = "veetee"
description = "A DEC VT terminal for the Linux and Windows desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
async-channel = "2"
cpal = "0.18"
glow = "0.18"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "1"
vt-core.workspace = true
vt-fonts.workspace = true
vt-keyboard.workspace = true
vt-render.workspace = true
vt-transport.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[lints]
workspace = true

# Debian package, built by `cargo xtask dist` with cargo-deb.
[package.metadata.deb]
maintainer = "Iain Smith <iain@issinoho.com>"
copyright = "2026 Iain Smith and the veetee contributors"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """\
veetee emulates DEC VT100, VT102, VT220, VT320 and VT420 terminals for OpenVMS and other \
DEC hosts, with Telnet, SSH, serial and local connections, DEC-style fonts and an LK401 \
keyboard layout."""
section = "x11"
priority = "optional"
depends = "$auto"
recommends = "openssh-client"
assets = [
    ["target/release/veetee", "usr/bin/", "755"],
    ["target/release/vt-headless", "usr/bin/", "755"],
    # LAT only, and only useful once it has been given CAP_NET_RAW, which is
    # not done here: see docs/lat-protocol.md and the helper's own comments.
    ["target/release/veetee-lat-helper", "usr/libexec/", "755"],
    ["../../data/com.issinoho.Veetee.desktop", "usr/share/applications/", "644"],
    ["../../data/com.issinoho.Veetee.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../data/icons/com.issinoho.Veetee.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../README.md", "usr/share/doc/veetee/README.md", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/veetee/CHANGELOG.md", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/veetee/LICENSE-APACHE", "644"],
    ["../../THIRD-PARTY.md", "usr/share/doc/veetee/THIRD-PARTY.md", "644"],
    ["../vt-fonts/fonts/OFL.txt", "usr/share/doc/veetee/fonts-OFL.txt", "644"],
]

# The same again for RPM distributions, built with cargo-generate-rpm. Paths
# here are relative to the workspace root, which is where cargo runs it.
[package.metadata.generate-rpm]
summary = "DEC VT terminal emulator for OpenVMS and other DEC hosts"
# Read the dependencies out of the ELF rather than shelling out to
# /usr/lib/rpm/find-requires, which is not on the Ubuntu runner that builds
# this. Sonames are what an RPM wants anyway: they name the same library on
# Fedora and openSUSE, whatever each calls the package holding it.
auto-req = "builtin"
assets = [
    { source = "target/release/veetee", dest = "/usr/bin/veetee", mode = "755" },
    { source = "target/release/vt-headless", dest = "/usr/bin/vt-headless", mode = "755" },
    # LAT only, and only useful once it has been given CAP_NET_RAW, which is
    # not done here: see docs/lat-protocol.md and the helper's own comments.
    { source = "target/release/veetee-lat-helper", dest = "/usr/libexec/veetee-lat-helper", mode = "755" },
    { source = "data/com.issinoho.Veetee.desktop", dest = "/usr/share/applications/com.issinoho.Veetee.desktop", mode = "644" },
    { source = "data/com.issinoho.Veetee.metainfo.xml", dest = "/usr/share/metainfo/com.issinoho.Veetee.metainfo.xml", mode = "644" },
    { source = "data/icons/com.issinoho.Veetee.svg", dest = "/usr/share/icons/hicolor/scalable/apps/com.issinoho.Veetee.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/veetee/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/veetee/CHANGELOG.md", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/doc/veetee/LICENSE-APACHE", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/doc/veetee/LICENSE-MIT", mode = "644", doc = true },
    { source = "THIRD-PARTY.md", dest = "/usr/share/doc/veetee/THIRD-PARTY.md", mode = "644", doc = true },
    { source = "crates/vt-fonts/fonts/OFL.txt", dest = "/usr/share/doc/veetee/fonts-OFL.txt", mode = "644", doc = true },
]
