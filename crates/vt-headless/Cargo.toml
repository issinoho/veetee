[package]
name = "vt-headless"
description = "Headless driver for veetee: trace, replay and conformance testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Raw mode for a LAT session, so the terminal stops echoing what the host is
# already echoing. LAT is Linux only in any case.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["termios", "stdio"] }

[dependencies]
vt-parser.workspace = true
vt-core.workspace = true
vt-lat.workspace = true
vt-transport.workspace = true

[lints]
workspace = true
