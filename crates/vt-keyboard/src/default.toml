# veetee keymap: PC keys to DEC LK401 keys.
#
# Each binding names a PC key (a GDK key name, with Ctrl+, Shift+ and Alt+
# prefixes) and the DEC key or local function it produces. When a DEC key is
# pressed with extra modifiers they are passed on, so Ctrl+Insert is Ctrl+Find.
# Local functions only match their exact modifiers.

name = "veetee default (PC to LK401)"

# Top row: F1–F5 are local functions, F6–F20 function keys.
[[bind]]
pc = "F1"
dec = "hold-screen"
[[bind]]
pc = "Pause"
dec = "hold-screen"
[[bind]]
pc = "F2"
dec = "print-screen"
[[bind]]
pc = "Print"
dec = "print-screen"
[[bind]]
pc = "F3"
dec = "set-up"
[[bind]]
pc = "F4"
dec = "session"
[[bind]]
pc = "F5"
dec = "break"
[[bind]]
pc = "Break"
dec = "break"
[[bind]]
pc = "Ctrl+F5"
dec = "answerback"
[[bind]]
pc = "Ctrl+Break"
dec = "answerback"
[[bind]]
pc = "F6"
dec = "f6"
[[bind]]
pc = "F7"
dec = "f7"
[[bind]]
pc = "F8"
dec = "f8"
[[bind]]
pc = "F9"
dec = "f9"
[[bind]]
pc = "F10"
dec = "f10"
[[bind]]
pc = "F11"
dec = "f11"
[[bind]]
pc = "F12"
dec = "f12"
