[[bind]]
pc = "Shift+F2"
dec = "f12"
[[bind]]
pc = "Shift+F3"
dec = "f13"
[[bind]]
pc = "Shift+F4"
dec = "f14"
[[bind]]
pc = "Shift+F5"
dec = "help"
[[bind]]
