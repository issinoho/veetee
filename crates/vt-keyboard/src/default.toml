# Editing keypad, by position.
[[bind]]
pc = "Insert"
dec = "find"
[[bind]]
pc = "Home"
dec = "insert-here"
[[bind]]
pc = "Page_Up"
dec = "remove"
[[bind]]
pc = "Delete"
dec = "select"
[[bind]]
pc = "End"
dec = "prev-screen"
[[bind]]
pc = "Page_Down"
dec = "next-screen"

# Cursor keys, and local panning with Ctrl.
[[bind]]
pc = "Up"
dec = "up"
[[bind]]
pc = "Down"
dec = "down"
[[bind]]
pc = "Left"
dec = "left"
[[bind]]
pc = "Right"
dec = "right"
[[bind]]
pc = "Ctrl+Up"
dec = "pan-up"
[[bind]]
pc = "Ctrl+Down"
dec = "pan-down"
[[bind]]
pc = "Ctrl+End"
dec = "pan-prev-page"
[[bind]]
pc = "Ctrl+Page_Down"
dec = "pan-next-page"

