[package]
name = "vt-transport"
description = "Host connections for veetee: local PTY or ConPTY, Telnet, SSH and serial lines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["pty", "termios", "process", "fs", "event", "stdio"] }

# LAT needs AF_PACKET, which is Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_Communication",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[dependencies]
vt-lat.workspace = true
socket2 = "0.6.5"
