# veetee is MIT OR Apache-2.0: only permissive licenses are allowed in the dependency tree.
[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# veetee's own fonts are released under the SIL Open Font License.
[[licenses.exceptions]]
crate = "vt-fonts"
allow = ["OFL-1.1"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
